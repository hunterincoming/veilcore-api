# Dependabot version updates: weekly, grouped, a few pull requests at a time.
#
# Every Dependabot pull request is reviewed by hand before merge, lockfile included:
# read the package-lock.json diff entry by entry (new packages, changed `resolved` hosts,
# new install scripts) and check it against the release notes. CI must pass. Never merge
# one unread, and never answer one with `npm audit fix`: lockfile changes are made by hand.
# Merging to `main` deploys the production registry, so a merge here is a deploy.
#
# Security updates follow the repository's Dependabot security settings, but the `ignore`
# entries below apply to them too: an entry that names only a dependency blocks its security
# pull requests as well. So the packages ignored below get no Dependabot pull requests at
# all, security included. Their alerts still show under Security > Dependabot, and are
# handled by hand.

version: 2
updates:
  # One package, one lockfile (the root package-lock.json). lineage/package.json only marks
  # that folder as ES modules and has no dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    # Let a release age before it is proposed, so a bad or hijacked version is usually
    # pulled before it reaches us.
    cooldown:
      default-days: 14
    groups:
      # There are no devDependencies today; the group is here for the first one.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Midnight packages are never updated here. The compiled contract vendored in
      # lineage/managed/contract checks for one compact-runtime version
      # (lineage/managed/SOURCE.json, test/vendored-contract.test.mjs), and this repository
      # does not recompile contracts. They move by hand, together with the vendored files.
      - dependency-name: "@midnight-ntwrk/*"
      - dependency-name: "@midnightntwrk/*"
      # The SDK is pinned exactly: the registry checks every batch and attestation with it,
      # so a new version is a deliberate, tested move (README), made by hand.
      - dependency-name: "veilcore-records"

  # Workflow actions are pinned by commit SHA with the version in a comment; Dependabot
  # updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
