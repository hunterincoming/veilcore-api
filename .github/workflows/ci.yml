name: CI

# Railway deploys main as soon as it moves, so this is the only check between a push and
# production. It does not block the deploy by itself; branch protection would.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  #v6.0.3
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  #v6.4.0
        with:
          # Exact version from .nvmrc, the one Railway runs (engines.node 24.x).
          node-version-file: .nvmrc

      # better-sqlite3 compiles from source here (node-gyp, the runner's compiler).
      - name: Install dependencies
        run: npm ci

      # Sets VEILCORE_OTS=off: no OpenTimestamps calendar or block explorer is contacted.
      - name: Test
        run: npm test

      # Advisories in what Railway runs. There are no devDependencies today; the flag keeps
      # a future test-only tool from blocking a release.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
